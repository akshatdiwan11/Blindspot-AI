# Render Blueprint: deploys the Blindspot AI API (Docker).
# In Render: New > Blueprint > pick this repository.
#
# No database is created here (Render allows only one free PostgreSQL database per account).
# Paste a PostgreSQL connection URL into DATABASE_URL, for example a free Neon database.
# If DATABASE_URL is left empty the API still starts, on a temporary SQLite file that is wiped
# whenever the service restarts or wakes from sleep.
services:
  - type: web
    name: blindspot-ai-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      # PostgreSQL connection URL, e.g. postgresql://user:password@host/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      # The website (Cloudflare Worker) calls the API through its own domain, so CORS is only
      # needed if you call the API from somewhere else. Comma-separated origins.
      - key: CORS_ORIGINS
        sync: false
      # Optional: enables the AI investigator. Leave empty to run without an LLM.
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_DAILY_BUDGET_USD
        value: "2.0"
